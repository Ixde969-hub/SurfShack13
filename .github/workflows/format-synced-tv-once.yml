name: Format synchronized television once

on:
  push:
    branches:
      - agent/feature-synced-video-tv

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/feature-synced-video-tv
      - uses: ./.github/actions/setup_node
      - name: Format the synchronized television interface
        run: |
          cd tgui
          yarn prettier --write packages/tgui/interfaces/SynchronizedTelevision.tsx
      - name: Commit formatter output and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-synced-tv-once.yml
          git add tgui/packages/tgui/interfaces/SynchronizedTelevision.tsx
          git commit -m "Format synchronized television interface"
          git push origin HEAD:agent/feature-synced-video-tv
