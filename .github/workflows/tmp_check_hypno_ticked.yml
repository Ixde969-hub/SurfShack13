name: Temporary hypno ticked-file check

on:
  push:
    branches:
      - tmp/hypno-ticked-check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hypno-telemetry-hud
      - name: Ticked File Enforcement
        run: |
          python3 tools/ticked_file_enforcement/ticked_file_enforcement.py < tools/ticked_file_enforcement/schemas/tgstation_dme.json
          python3 tools/ticked_file_enforcement/ticked_file_enforcement.py < tools/ticked_file_enforcement/schemas/unit_tests.json
